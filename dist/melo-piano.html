<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>メロのピアノれんしゅう</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#2F9BF0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="メロのピアノ">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Noto+Music&display=swap">
<style>
/* Layout: one-column phone-first app, Duolingo-style chunky buttons, bottom tab bar. Mascot "メロ" (a glasses-wearing music bird) carries the mood. */
:root{
  --bg:#EEF8FF; --surface:#FFFFFF; --surface-2:#F5FAFE; --ink:#21304A; --muted:#66768E; --line:#D5E5F2;
  --primary:#2F9BF0; --primary-deep:#1A76C8; --sun:#FFC83A; --sun-deep:#E3A10B;
  --grass:#3FBF73; --grass-deep:#2A9958; --grass-soft:#DDF7E7; --coral:#FF6457; --coral-deep:#D8413A; --coral-soft:#FFE4E1;
  --berry:#B05CE6; --staff:#21304A; --paper:#FFFFFF;
  --f-display:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-music:"Noto Music","Bravura","Segoe UI Symbol",serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1A2A; --surface:#182739; --surface-2:#1E3045; --ink:#EAF2FB; --muted:#9DB0C7; --line:#2C4260;
  --grass-soft:#18392A; --coral-soft:#43221F; --staff:#21304A; --paper:#FFFFFF; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1A2A; --surface:#182739; --surface-2:#1E3045; --ink:#EAF2FB; --muted:#9DB0C7; --line:#2C4260;
  --grass-soft:#18392A; --coral-soft:#43221F; --staff:#21304A; --paper:#FFFFFF; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;-webkit-touch-callout:none;touch-action:manipulation;overscroll-behavior-y:none;background:var(--bg);color:var(--ink);font-family:var(--f-display);font-weight:500;font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
input,select,textarea{font-size:16px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:800;text-wrap:balance;line-height:1.3}
.app{max-width:640px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 110px}
.screen{display:flex;flex-direction:column;gap:16px}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.15rem}
.stats{display:flex;gap:8px}
.stat{display:flex;align-items:center;gap:4px;font-weight:800;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:4px 12px 4px 8px;font-variant-numeric:tabular-nums}
.stat svg{width:22px;height:22px}
.snd{color:var(--ink);padding:4px 10px;cursor:pointer}
.snd svg{width:22px;height:22px}
.stat.flame.off{filter:grayscale(1);opacity:.6}

/* chunky buttons */
.btn{border:0;border-radius:16px;padding:14px 20px;font-weight:800;font-size:1.05rem;letter-spacing:.04em;background:var(--primary);color:#fff;box-shadow:0 4px 0 var(--primary-deep);transition:transform .06s, box-shadow .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--primary-deep)}
.btn.green{background:var(--grass);box-shadow:0 4px 0 var(--grass-deep)}
.btn.red{background:var(--coral);box-shadow:0 4px 0 var(--coral-deep)}
.btn.sun{background:var(--sun);color:#5A3B00;box-shadow:0 4px 0 var(--sun-deep)}
.btn.ghost{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.small{padding:8px 14px;font-size:.92rem;border-radius:12px}
.btn.wide{width:100%}
.btn:disabled{background:var(--line);color:var(--muted);box-shadow:0 4px 0 var(--line);cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1 1 140px;min-width:0}

.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:16px}
.muted{color:var(--muted)}
.label{font-size:.78rem;letter-spacing:.08em;color:var(--muted);font-weight:700}

/* mascot card */
.mascot-card{display:grid;grid-template-columns:132px 1fr;gap:12px;align-items:center;border-radius:24px;padding:14px 16px;border:2px solid var(--line);position:relative;overflow:hidden}
.bg-sky{background:linear-gradient(180deg,#CFEBFF,#F2FAFF)}
.bg-stars{background:radial-gradient(circle at 20% 30%,#fff8 1.5px,transparent 2px),radial-gradient(circle at 70% 20%,#fff8 1.5px,transparent 2px),radial-gradient(circle at 85% 70%,#fff8 1.5px,transparent 2px),linear-gradient(180deg,#2B3A78,#5B4FA8)}
.bg-ocean{background:linear-gradient(180deg,#9BE7E2,#3FB6C9)}
.bg-sakura{background:linear-gradient(180deg,#FFE0EC,#FFF6F9)}
.bg-angry{background:linear-gradient(180deg,#FFC9C2,#FFEDEA)}
.mascot-card .bubble{background:#fff;color:#21304A;border-radius:18px;padding:12px 14px;font-weight:700;position:relative;box-shadow:0 3px 0 #0001}
.mascot-card .bubble::before{content:"";position:absolute;left:-10px;top:24px;border:8px solid transparent;border-right-color:#fff;border-left:0}
.mascot svg{width:100%;height:auto;display:block}
.mascot.angry svg{animation:shake .5s infinite}
.mascot.happy svg{animation:bounce 1.6s infinite}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px) rotate(-2deg)}75%{transform:translateX(3px) rotate(2deg)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion: reduce){.mascot svg{animation:none!important}}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week .d{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.78rem;color:var(--muted);font-weight:700}
.week .dot{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;background:var(--surface)}
.week .dot.done{background:var(--sun);border-color:var(--sun-deep)}
.week .dot.today{border-color:var(--primary)}
.week .dot svg{width:18px;height:18px}

/* lesson cards */
.lessons{display:grid;gap:12px}
.lesson{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;text-align:left;background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:20px;padding:14px}
.lesson:active{transform:translateY(2px);border-bottom-width:3px}
.lesson .ic{width:64px;height:64px;border-radius:18px;display:grid;place-items:center}
.lesson .ic svg{width:46px;height:46px}
.lesson .ic{border:2px solid rgba(74,59,52,.18)}
.lesson h3{font-size:1.1rem}
.lesson .sub{font-size:.85rem;color:var(--muted)}
.lesson .check{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--line)}
.lesson .check.on{background:var(--grass)}
.lesson .check svg{width:20px;height:20px}
.bar{height:12px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--grass);border-radius:999px;transition:width .4s}
.bar.sun>i{background:var(--sun)}

.teacher-note{display:flex;gap:12px;align-items:flex-start}
.teacher-note .av{flex:none;width:40px;height:40px;border-radius:50%;background:#EFE3FF;color:#4A3B34;border:2px solid #4A3B34;display:grid;place-items:center;font-weight:800}

.kana-sw{display:flex;justify-content:flex-end;align-items:center;gap:6px;flex-wrap:wrap;margin:-4px 0 2px}
.kana-sw .seg button{font-size:.8rem}
/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:2px solid var(--line);display:flex;justify-content:center;gap:4px;padding:6px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:20}
.nav button{flex:1;max-width:160px;border:2px solid transparent;background:none;border-radius:14px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;font-size:.78rem;font-weight:800;color:var(--muted)}
.nav button svg{width:30px;height:30px}
.nav button:not(.on) svg{opacity:.85}
.nav button.on{color:var(--primary);border-color:var(--primary);background:var(--surface-2)}

/* lesson screens */
.lesson-top{display:flex;align-items:center;gap:12px}
.x{border:0;background:none;padding:4px;width:40px;height:40px;color:var(--muted)}
.x svg{width:28px;height:28px}
.lesson-top .bar{flex:1;height:16px;margin:0}
.hearts{display:flex;gap:2px}
.hearts svg{width:24px;height:24px}
.prompt{font-size:1.3rem;font-weight:800}
.staff-wrap{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:8px;display:flex;justify-content:center}
.staff-wrap svg{width:100%;max-width:420px;height:auto}
.staff-wrap.grand svg{max-width:340px;max-height:46vh}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.steps button{border:2px solid var(--line);border-bottom-width:5px;background:var(--surface);border-radius:16px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:.9rem}
.steps button small{font-weight:500;color:var(--muted);font-size:.75rem}
.steps button.on{border-color:var(--berry);background:var(--berry);color:#fff}
.steps button.on small{color:#fff}
.steps .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--berry);color:#fff;font-size:.8rem}
.steps button.on .n{background:#fff;color:var(--berry)}
.answers{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:10px}
.ans{border:2px solid var(--line);border-bottom-width:5px;background:var(--surface);border-radius:16px;padding:16px 6px;font-size:1.5rem;font-weight:800}
.ans:active{transform:translateY(2px);border-bottom-width:3px}
.ans.ok{background:var(--grass-soft);border-color:var(--grass);color:var(--grass-deep)}
.ans.ng{background:var(--coral-soft);border-color:var(--coral);color:var(--coral-deep)}
.feedback{position:fixed;left:0;right:0;bottom:0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:30;animation:up .2s ease-out}
.feedback .in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.feedback.ok{background:var(--grass-soft);color:var(--grass-deep)}
.feedback.ng{background:var(--coral-soft);color:var(--coral-deep)}
.feedback h2{font-size:1.4rem}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}

/* rhythm */
.rhythm-list{display:grid;gap:10px}
.rcard{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;padding:10px 12px;text-align:left}
.rcard svg.notation{width:100%;height:auto;max-height:90px}
.stars{display:flex;gap:2px}
.stars svg{width:22px;height:22px}
.notation-wrap{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:6px}
.notation-wrap svg{width:100%;height:auto;display:block}
.notation .nt{transition:color .08s}
.notation .nt.on{color:#2F9BF0!important;filter:drop-shadow(0 0 4px rgba(47,155,240,.6))}
.countin{font-size:2rem;font-weight:800;text-align:center;min-height:3rem;color:var(--primary)}
.tap-pad{touch-action:none;-webkit-touch-callout:none;width:100%;aspect-ratio:2.4/1;max-height:200px;border-radius:28px;border:0;background:var(--sun);box-shadow:0 8px 0 var(--sun-deep);font-size:1.6rem;font-weight:800;color:#5A3B00;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.tap-pad.hit{transform:translateY(5px);box-shadow:0 3px 0 var(--sun-deep)}
.tap-pad:disabled{background:var(--line);box-shadow:0 8px 0 var(--line);color:var(--muted)}
.timeline{position:relative;height:44px;background:var(--surface-2);border-radius:12px;border:2px solid var(--line)}
.timeline i{position:absolute;top:6px;bottom:6px;width:4px;margin-left:-2px;border-radius:2px;background:var(--muted);opacity:.5}
.timeline b{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--primary)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:4px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}

/* song */
.score-box{position:relative;background:var(--paper);border:2px solid var(--line);border-radius:16px;overflow:hidden;touch-action:none}
.score-box img,.score-box .sample{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.score-box svg.overlay{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);display:grid;place-items:center;color:#fff;font-weight:800;font-size:.85rem;border:2px solid #fff;box-shadow:0 2px 4px #0004;cursor:pointer;padding:0}
.pin span{transform:rotate(45deg)}
.pin.active{outline:3px solid var(--sun);outline-offset:2px}
.pins-list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.pins-list li{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:12px;background:var(--surface-2)}
.pins-list li.active{background:#FFF3C7;color:#21304A}
.pins-list .num{flex:none;width:26px;height:26px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:800;font-size:.8rem}
.checklist{display:grid;gap:8px;list-style:none;margin:0;padding:0}
.checklist button{width:100%;display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px}
.checklist .box{flex:none;width:28px;height:28px;border-radius:8px;border:3px solid var(--line);display:grid;place-items:center}
.checklist .on .box{background:var(--grass);border-color:var(--grass-deep)}
.checklist .box svg{width:18px;height:18px}
.timer{font-size:2.6rem;font-weight:800;font-variant-numeric:tabular-nums;text-align:center;letter-spacing:.04em}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tools button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;font-weight:800;font-size:.9rem}
.tools button.on{border-color:var(--primary);background:var(--primary);color:#fff}
.swatch{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);padding:0}
.swatch.on{box-shadow:0 0 0 3px var(--ink)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.rate button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 4px;font-weight:800;font-size:.85rem}
.rate button.on{border-color:var(--primary);background:var(--primary);color:#fff}

/* shop */
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.item{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;padding:12px 8px;text-align:center}
.item .pv{width:96px;height:96px;border-radius:16px;overflow:hidden}
.item .pv svg{width:100%;height:100%}
.item .price{display:flex;align-items:center;gap:4px;font-weight:800}
.item .price svg{width:18px;height:18px}
.item.equipped{border-color:var(--grass)}

/* teacher */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tabs button{flex:none;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:800;font-size:.9rem}
.tabs button.on{background:var(--berry);border-color:var(--berry);color:#fff}
.note-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:4px 2px 6px;display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:.85rem}
.chip svg{width:100%;height:auto;background:#fff;border-radius:10px}
.chip.on{border-color:var(--primary);background:var(--primary);color:#fff}
.chip small{font-weight:500;opacity:.8;font-size:.7rem}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:800;font-size:.9rem}
.list-edit{display:grid;gap:8px}
.list-edit .r{display:flex;gap:8px}
.list-edit .r input{flex:1;min-width:0}
.del{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:0 12px;font-weight:800;color:var(--coral-deep)}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th{font-size:.78rem;color:var(--muted)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:0 auto}
.keypad button{padding:16px 0;font-size:1.4rem;font-weight:800;border:2px solid var(--line);border-bottom-width:5px;background:var(--surface);border-radius:16px}
.pin-dots{display:flex;justify-content:center;gap:14px}
.pin-dots i{width:18px;height:18px;border-radius:50%;border:3px solid var(--berry)}
.pin-dots i.f{background:var(--berry)}
.builder-tokens{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.builder-tokens button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:4px;display:flex;flex-direction:column;align-items:center;color:#21304A;font-size:.75rem;font-weight:800}
.builder-tokens svg{width:100%;height:46px}

/* overlays */
.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;z-index:50;padding:max(16px,env(safe-area-inset-left,0px))}
.modal .card{max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px;text-align:center}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:800;z-index:60;box-shadow:0 4px 12px #0003;max-width:90vw;text-align:center}
.result{text-align:center;align-items:center}
.result .big{font-size:2rem;font-weight:800}
.reward{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.reward .card{min-width:120px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px}
.reward b{font-size:1.6rem;font-variant-numeric:tabular-nums}
/* opening banner (same picture as the share preview) */
.splash{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:linear-gradient(160deg,#CFEBFF 0%,#EEF8FF 55%,#FFF6E0 100%);transition:opacity .5s ease;cursor:pointer;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.splash.out{opacity:0;pointer-events:none}
.splash .sp-in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);align-items:center;gap:28px;max-width:980px;width:100%}
.splash .sp-mel{width:100%;max-width:400px;justify-self:end;animation:sp-pop .6s ease-out both}
.splash .sp-mel svg{width:100%;height:auto;display:block}
.splash .sp-txt{display:flex;flex-direction:column;gap:16px;color:#21304A}
.splash .sp-sub{font-weight:800;color:#2F9BF0;letter-spacing:.08em;font-size:clamp(.95rem,2.6vw,1.6rem)}
.splash .sp-title{font-weight:800;line-height:1.1;font-size:clamp(2.6rem,8vw,4.8rem)}
.splash .sp-tags{display:flex;gap:10px;flex-wrap:wrap}
.splash .sp-tags span{color:#fff;font-weight:800;padding:8px 16px;border-radius:999px;font-size:clamp(.9rem,2.2vw,1.35rem)}
@media (max-width:640px),(orientation:portrait) and (max-width:900px){
  .splash .sp-in{grid-template-columns:1fr;justify-items:center;text-align:center;gap:14px}
  .splash .sp-mel{justify-self:center;max-width:min(64vw,320px)}
  .splash .sp-txt{align-items:center}

function mascotSVG(m="normal",eq=P().equip){const c=MOODCOL[m],ln="#4A3B34",gl=eq.glasses&&eq.glasses!=="#21304A"?eq.glasses:ln,w=3.2;

  if(eq.head==="crown")g+=`<path d="M68 74 L73 42 L87 58 L100 36 L113 58 L127 42 L132 74 Z" fill="#FFE08A" stroke="${ln}" stroke-width="2.5"/><circle cx="100" cy="62" r="4" fill="#FF9AA8"/>`;

  if(eq.head==="ribbon")g+=`<path d="M140 68 l-18 -11 v22z M140 68 l18 -11 v22z" fill="#FFC2D6" stroke="${ln}" stroke-width="2.5"/><circle cx="140" cy="68" r="5" fill="#FF9DBB" stroke="${ln}" stroke-width="2"/>`;
  if(eq.head==="flower")g+=`<g transform="translate(62 72)">${[0,72,144,216,288].map(a=>`<circle cx="${(Math.cos(a*Math.PI/180)*8).toFixed(1)}" cy="${(Math.sin(a*Math.PI/180)*8).toFixed(1)}" r="6" fill="#fff" stroke="#E9A3BB" stroke-width="2"/>`).join("")}<circle r="5" fill="#FFE08A"/></g>`;

  g+=`<g stroke="#F08AA0" stroke-width="1.8"><path d="M60 137 l4 -6 M65 137 l4 -6 M70 137 l4 -6 M128 137 l4 -6 M133 137 l4 -6 M138 137 l4 -6"/></g>`;
  // eyes
  if(m==="happy")g+=`<path d="M78 120 q6 -7 12 0 M110 120 q6 -7 12 0" fill="none" stroke="${ln}" stroke-width="3.4"/>`;
  else g+=`<circle cx="84" cy="118" r="4.6" fill="${ln}" stroke="none"/><circle cx="116" cy="118" r="4.6" fill="${ln}" stroke="none"/><circle cx="85.6" cy="116.4" r="1.4" fill="#fff" stroke="none"/><circle cx="117.6" cy="116.4" r="1.4" fill="#fff" stroke="none"/>`;

/* ================= NOTES QUIZ ================= */
let Q;
function startNotes(){const a=S.assignment;if(!a.notes.length){app.innerHTML=`<section class="screen">${backBar("がくふを よもう")}<div class="card">せんせいが まだ おんぷを えらんでいません。</div></section>`;bindBack();return}
  const list=[];let last=null;for(let i=0;i<a.notesCount;i++){let n;do{n=a.notes[Math.floor(Math.random()*a.notes.length)]}while(a.notes.length>1&&n===last);list.push(n);last=n}
  let names=a.answerMode==="all"?LET:LET.filter(l=>a.notes.some(n=>n.split(":")[1][0]===l));if(names.length<3)names=LET;
  Q={list,i:0,hearts:3,correct:0,names};renderQ()}
function renderQ(){const id=Q.list[Q.i],[clef,note]=id.split(":");
  app.innerHTML=`<section class="screen narrow"><div class="lesson-top"><button class="x" id="quit" aria-label="やめる">${IC.x}</button><div class="bar"><i style="width:${Q.i/Q.list.length*100}%"></i></div><div class="hearts">${[0,1,2].map(i=>i<Q.hearts?IC.heart:IC.heartOff).join("")}</div>${sndBtn()}</div>
  <div class="prompt">この おとは なに?</div><div class="label">${S.assignment.staffView==="grand"?"大譜表":CLEF[clef].jp+"きごう"}</div>
  <div class="staff-wrap ${S.assignment.staffView==="grand"?"grand":""}">${S.assignment.staffView==="grand"?grandSVG(clef,note):staffSVG(clef,note)}</div>
  <div class="answers">${Q.names.map(l=>`<button class="ans" data-a="${l}">${SOL[l]}</button>`).join("")}</div></section>`;
  $("#quit").onclick=()=>go("home");
  $$(".ans").forEach(b=>b.onclick=()=>answerQ(b))}
function answerQ(btn){if($(".feedback"))return;const id=Q.list[Q.i],note=id.split(":")[1],ok=btn.dataset.a===note[0];
  $$(".ans").forEach(b=>{b.disabled=true;if(b.dataset.a===note[0])b.classList.add("ok")});
  // show the answer on the staff: the note's name right beside the notehead, then read it aloud
  {const [clef]=id.split(":"),lo={label:SOL[note[0]],color:ok?"#2A9958":"#D8413A"};$(".staff-wrap").innerHTML=S.assignment.staffView==="grand"?grandSVG(clef,note,lo):staffSVG(clef,note,lo)}
  setTimeout(()=>sayJa(SOL[note[0]]),ok?650:550);
  if(ok){Q.correct++;tone(freqOf(note),0,.8);setTimeout(()=>sfx("ok"),300)}else{btn.classList.add("ng");Q.hearts--;sfx("ng");$(".hearts").innerHTML=[0,1,2].map(i=>i<Q.hearts?IC.heart:IC.heartOff).join("")}
  const f=document.createElement("div");f.className="feedback "+(ok?"ok":"ng");
  f.innerHTML=`<div class="in"><h2>${ok?["せいかい!","すごい!","ばっちり!"][Q.i%3]:"ざんねん…"}</h2><button class="btn ${ok?"green":"red"} wide" id="next">${Q.hearts<=0?"おわる":"つぎへ"}</button></div>`;
  document.body.appendChild(f);$("#next").focus();
  $("#next").onclick=()=>{f.remove();if(Q.hearts<=0||Q.i>=Q.list.length-1)finishNotes();else{Q.i++;renderQ()}}}
function finishNotes(){const done=Q.hearts>0,perfect=done&&Q.correct===Q.list.length,r=dayRec();
  let coins=Q.correct+(perfect?5:0);r.notesC+=Q.correct;r.notesT+=Q.i+1;
  if(done){r.notesS++;weekly().notes++}
  const sb=done?markPractice():0;coins+=0;P().coins+=coins;P().xp+=Q.correct*2;save();
  resultScreen({title:done?(perfect?"パーフェクト!":"レッスン クリア!"):"ハートが なくなっちゃった",ok:done,lines:[["せいかい",`${Q.correct}/${Q.list.length}`],["コイン",`+${coins}`]],streak:sb,again:()=>go("notes")})}

function resultScreen({title,ok,lines,streak,again,next,extra=""}){
  app.innerHTML=`<section class="screen result narrow"><div class="mascot ${ok?"happy":"worried"}" style="width:180px">${mascotSVG(ok?"happy":"worried")}</div><div class="big">${esc(title)}</div>
  <div class="reward">${lines.map(([k,v])=>`<div class="card"><span class="label">${k}</span><b>${v}</b></div>`).join("")}${streak?`<div class="card"><span class="label">れんぞくボーナス</span><b>+${streak}</b></div>`:""}</div>${extra}
  ${next?`<div class="row" style="width:100%"><button class="btn ghost grow" id="again">もういちど</button><button class="btn green grow" id="nextL">${next.label}</button></div><button class="btn ghost small" id="home">ホームへ もどる</button>`
    :`<div class="row" style="width:100%"><button class="btn ${ok?"ghost":"green"} grow" id="again">もういちど</button><button class="btn ${ok?"green":"ghost"} grow" id="home">ホームへ</button></div>`}</section>`;
  if(ok){sfx("win");confetti()}else sfx("ng");$("#again").onclick=again;$("#home").onclick=()=>go("home");if(next)$("#nextL").onclick=next.go;if(streak)setTimeout(()=>toast(`${P().streak}日れんぞく! ボーナス コイン+${streak}`),900)}

function backBar(title,raw){return `<div class="lesson-top"><button class="x" id="back" aria-label="もどる">${IC.back}</button><h2 style="font-size:1.2rem;flex:1;min-width:0"${raw?" data-raw":""}>${esc(title)}</h2><span class="stat">${IC.coin}${P().coins}</span>${sndBtn()}</div>`}
function bindBack(to="home"){$("#back").onclick=()=>go(to)}

/* ================= FINGER NUMBERS ================= */
/* hand seen from above (back of the hand): right thumb on the left, left thumb on the right */
/* back of the hand, fingers up, thumbs pointing to the middle (right thumb on the left). Each finger: base centre (bx,by), angle r, length L, base/tip half-widths */
const FG=[{f:1,bx:68,by:186,r:-38,L:70,wb:12.5,wt:9.5,e:0},{f:2,bx:91,by:131,r:-7,L:96,wb:9.6,wt:8.2},{f:3,bx:119.5,by:125,r:-1,L:106,wb:10,wt:8.6},{f:4,bx:147.5,by:131,r:6,L:98,wb:9.6,wt:8.2},{f:5,bx:172,by:147,r:14,L:76,wb:8.2,wt:7}];
const HANDNAME={R:"みぎて",L:"ひだりて",B:"りょうて"};
const FREAD=["","いち","に","さん","よん","ご"];
const rotP=(px,py,cx,cy,deg)=>{const a=deg*Math.PI/180,dx=px-cx,dy=py-cy;return[cx+dx*Math.cos(a)-dy*Math.sin(a),cy+dx*Math.sin(a)+dy*Math.cos(a)]};
function handSVG(hand,o={}){const L=hand==="L",col=o.colors||{},nums=o.nums!==false,W=214;
  const skin="#F7DCC7",line="#B98468",paint={hl:["#FFC83A","#E3A10B"],ok:["#8FE3B0","#2A9958"],ng:["#FF9C93","#D8413A"]};
  const fside=(F,e=F.e??16)=>`M${-F.wb} ${e} L${-F.wt} ${-F.L+F.wt} A${F.wt} ${F.wt} 0 0 1 ${F.wt} ${-F.L+F.wt} L${F.wb} ${e}`,fpath=(F,e)=>fside(F,e)+" Z",tf=F=>`translate(${F.bx} ${F.by}) rotate(${F.r})`;
  const palm="M150 330 C155 282 169 218 180 147 Q122 114 81.5 131 C81 152 71 172 65 165 L58.2 193.7 C64 201 72 224 76 244 C82 266 90 292 92 330 Z";
  // outline: every shape stroked thick, then filled on top so only the outer edge of the whole hand keeps a line
  let body=`<path d="${palm}" fill="${line}" stroke="${line}" stroke-width="5"/>`+FG.map(F=>`<path d="${fpath(F)}" transform="${tf(F)}" fill="${line}" stroke="${line}" stroke-width="5" stroke-linejoin="round"/>`).join("")+`<path d="${palm}" fill="${skin}"/>`,tips="";
  FG.forEach(F=>{const st=col[F.f]||(o.hl===F.f?"hl":null),[fc,sc]=paint[st]||[skin,null];
    body+=`<g data-f="${F.f}" class="fg ${st==="hl"?"glow":""}" transform="${tf(F)}"><path d="${fpath(F)}" fill="${skin}"/>${sc?`<path d="${fpath(F,2)}" fill="${fc}"/><path d="${fside(F,2)}" fill="none" stroke="${sc}" stroke-width="3.5" stroke-linejoin="round"/>`:""}<rect x="${-F.wt*.64}" y="${-F.L+F.wt*.35}" width="${F.wt*1.28}" height="${F.wt*1.75}" rx="${F.wt*.62}" fill="#F4CFC4" stroke="#D9A592" stroke-width="1.2"/><rect x="${-F.wt*.3}" y="${-F.L+F.wt*.6}" width="${F.wt*.6}" height="${F.wt*.5}" rx="${F.wt*.25}" fill="#FFF3EF"/></g>`;
    if(nums||st){const a=F.r*Math.PI/180,d=F.L+18;let x=F.bx+Math.sin(a)*d;const y=F.by-Math.cos(a)*d;if(L)x=W-x;
      tips+=`<g data-f="${F.f}" class="fg"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="11.5" fill="#fff" stroke="${sc||line}" stroke-width="2.5"/><text x="${x.toFixed(1)}" y="${(y+5).toFixed(1)}" text-anchor="middle" font-size="15" font-weight="800" fill="#21304A" font-family="sans-serif">${F.f}</text></g>`}});
  body+=`<g stroke="${line}" stroke-width="1.6" stroke-linecap="round" fill="none" opacity=".75"><path d="M104 128 q1.5 5 0 10"/><path d="M133 127 q1.5 5 0 10"/><path d="M160 136 q1.5 5 0 9"/></g>`;
  return `<svg viewBox="-4 -22 222 262" class="hand" role="img" aria-label="${HANDNAME[hand]}"><g${L?` transform="translate(${W} 0) scale(-1 1)"`:""}>${body}</g>${tips}</svg>`}
function handIcon(){return handSVG("R",{nums:false}).replace(/viewBox="[^"]*"/,'viewBox="-2 12 218 232"').replace(/stroke-width="5"/g,'stroke-width="9"')}
const handsHTML=(hands,o)=>`<div class="hands ${hands.length===1?"one":""}">${hands.map(h=>`<div class="hand-box" data-hand="${h}"><div class="label">${HANDNAME[h]}</div>${handSVG(h,typeof o==="function"?o(h):o)}</div>`).join("")}</div>`;
const handList=h=>h==="B"?["L","R"]:[h];
/* read the number aloud (browser voice); respects the in-app mute */
/* read-aloud: prefer a female Japanese voice where the device has one, and raise the pitch so it sounds bright and friendly */
/* voice ranking: natural online voices first (Edge "Nanami Online (Natural)", Chrome "Google 日本語"), then device female voices; male voices last */
const VOICE_RANK=[/Nanami.*(Natural|Online)/i,/Aoi.*(Natural|Online)|Mayu|Shiori/i,/Google 日本語/i,/Kyoko|O-?Ren|Hattori-F/i,/ja-jp-x-(htm|jab|jac)/i,/Haruka|Ayumi|Sayaka|Mizuki|Hikari|Nanami|female|女性/i];
const MALE_VOICE=/Ichiro|Otoya|Keita|Daichi|Naoki|Hattori(?!-F)|male|男性/i;
const voiceScore=v=>{const n=v.name+" "+v.voiceURI;if(MALE_VOICE.test(n)&&!/female/i.test(n))return 99;const r=VOICE_RANK.findIndex(x=>x.test(n));return r<0?50:r};
const jaVoices=()=>{try{return speechSynthesis.getVoices().filter(v=>/^ja/i.test(v.lang)).sort((a,b)=>voiceScore(a)-voiceScore(b))}catch(e){return[]}};
let jaVoice=null;
function pickJaVoice(){const vs=jaVoices();jaVoice=(S.prefs&&S.prefs.voiceName&&vs.find(v=>v.name===S.prefs.voiceName))||vs[0]||null}
try{if(window.speechSynthesis){pickJaVoice();speechSynthesis.addEventListener?speechSynthesis.addEventListener("voiceschanged",pickJaVoice):(speechSynthesis.onvoiceschanged=pickJaVoice)}}catch(e){}
function sayJa(t,onStart,rate){try{if(S.prefs.mute||!window.speechSynthesis)return;speechSynthesis.cancel();if(!jaVoice)pickJaVoice();const u=new SpeechSynthesisUtterance(t);u.lang="ja-JP";u.rate=rate||1.1;u.pitch=jaVoice&&/Natural|Online|Google/i.test(jaVoice.name)?1.25:1.6;u.volume=1;if(jaVoice)u.voice=jaVoice;if(onStart)u.onstart=onStart;speechSynthesis.speak(u)}catch(e){}}
/* speech engines start talking a little after speak() is called (often 0.2-0.5 s, more for online voices).
   sayOnBeat() asks early by that delay and keeps learning it from each utterance's real start time. */
let speechLead=.3;
function sayOnBeat(text,whenAudio,timers){const A=ac();if(!A)return;const target=performance.now()+(whenAudio-A.currentTime)*1000,ask=target-speechLead*1000;
  timers.push(setTimeout(()=>sayJa(text,()=>{const late=(performance.now()-target)/1000;speechLead=clamp(speechLead+late*.6,0,.9)},1.35),Math.max(0,ask-performance.now())))}
let FSO=null;
function fingerOrder(){const F=S.assignment.finger;if(!F.shuffleEx)return F.ex;
  if(!FSO||FSO.length!==F.ex.length||FSO.some(id=>!F.ex.find(e=>e.id===id)))FSO=shuffle(F.ex.map(e=>e.id));return FSO.map(id=>F.ex.find(e=>e.id===id))}
function startFinger(){FSO=null;const F=S.assignment.finger;if(F.stage===2)return renderFingerList();renderFingerLearn()}
function renderFingerLearn(){const F=S.assignment.finger;let sel=null;
  function draw(){app.innerHTML=`<section class="screen narrow">${backBar("ゆびばんごう")}<div class="card"><b>ゆびには ばんごうが あるよ</b><p class="muted" style="margin:4px 0 0">おやゆびが 1、こゆびが 5。ゆびを タップしてみよう。</p></div>
    <div id="lh">${handsHTML(["L","R"],h=>({hl:sel&&sel.hand===h?sel.f:null}))}</div>
    <div class="countin" aria-live="polite">${sel?`${HANDNAME[sel.hand]}の <span class="fbig">${sel.f}</span>`:"&nbsp;"}</div>
    <button class="btn green wide" id="quiz">クイズに ちょうせん!(${F.quizCount}もん)</button></section>`;
    bindBack();$("#quiz").onclick=()=>startFingerQuiz();
    $$("#lh .hand-box").forEach(box=>box.addEventListener("pointerdown",e=>{const g=e.target.closest(".fg");if(!g)return;sel={hand:box.dataset.hand,f:+g.dataset.f};sayJa(FREAD[sel.f]);draw()}))}
  draw()}
let FQ;
function startFingerQuiz(){const F=S.assignment.finger,list=[];let last="";
  for(let i=0;i<F.quizCount;i++){let q;do{q={hand:F.quizHand==="B"?(Math.random()<.5?"R":"L"):F.quizHand,f:1+Math.floor(Math.random()*5)}}while(q.hand+q.f===last);last=q.hand+q.f;list.push(q)}
  FQ={list,i:0,correct:0};renderFQ()}
function renderFQ(){const {hand,f}=FQ.list[FQ.i];
  app.innerHTML=`<section class="screen narrow"><div class="lesson-top"><button class="x" id="quit" aria-label="やめる">${IC.x}</button><div class="bar"><i style="width:${FQ.i/FQ.list.length*100}%"></i></div>${sndBtn()}</div>
   <div class="prompt" style="text-align:center">${HANDNAME[hand]}の <span class="fbig">${f}</span> の ゆびは どれ?</div>
   <div id="qh">${handsHTML([hand],{nums:false})}</div></section>`;
  $("#quit").onclick=()=>go("home");
  $("#qh").addEventListener("pointerdown",e=>{const g=e.target.closest(".fg");if(!g||$(".feedback"))return;const t=+g.dataset.f,ok=t===f;
    $("#qh").innerHTML=handsHTML([hand],{colors:ok?{[f]:"ok"}:{[t]:"ng",[f]:"ok"}});
    if(ok){FQ.correct++;sfx("ok");sayJa(FREAD[f])}else sfx("ng");
    const fb=document.createElement("div");fb.className="feedback "+(ok?"ok":"ng");
    fb.innerHTML=`<div class="in"><h2>${ok?["せいかい!","すごい!","ばっちり!"][FQ.i%3]:"ざんねん…"}</h2>${ok?"":`<div>${HANDNAME[hand]}の ${f}は みどりの ゆびだよ</div>`}<button class="btn ${ok?"green":"red"} wide" id="next">つぎへ</button></div>`;
    document.body.appendChild(fb);$("#next").onclick=()=>{fb.remove();if(FQ.i>=FQ.list.length-1)finishFQ();else{FQ.i++;renderFQ()}}})}
function finishFQ(){const r=dayRec(),perfect=FQ.correct===FQ.list.length;let coins=FQ.correct+(perfect?5:0);
  r.finger=(r.finger||0)+1;const w=weekly();w.finger=(w.finger||0)+1;const sb=markPractice();P().coins+=coins;save();
  resultScreen({title:perfect?"パーフェクト!":"クイズ おしまい!",ok:true,lines:[["せいかい",`${FQ.correct}/${FQ.list.length}`],["コイン",`+${coins}`]],streak:sb,again:()=>startFingerQuiz(),
    next:S.assignment.finger.ex.length?{label:"つぎに すすむ",go:()=>go("fingerList")}:null})}
const seqHTML=(seq,sm)=>`<div class="fseq">${seq.split("|").filter(Boolean).map(gr=>`<div class="fgroup">${[...gr].map(c=>`<span class="fn ${sm?"sm":""}">${c}</span>`).join("")}</div>`).join("")}</div>`;
/* step 2: choose a hand, then solve N cards one at a time (a card = one "|" block of that hand's exercises) */
function fingerPool(hand){return S.assignment.finger.ex.filter(e=>e.hand===hand).flatMap(e=>e.seq.split("|").filter(Boolean))}
function makeSession(hand){const F=S.assignment.finger,pool=fingerPool(hand),n=F.perSession||5;if(!pool.length)return[];
  const out=[];let src=F.shuffleBlocks?shuffle(pool):pool.slice();while(out.length<n){out.push(...src);src=F.shuffleBlocks?shuffle(pool):pool.slice()}return out.slice(0,n)}
const HAND_TILES=[["R","右手","みぎて"],["L","左手","ひだりて"],["B","両手","りょうて"]];
function renderFingerList(){const F=S.assignment.finger;

  target:"common",common:null,indiv:{},mine:null,lastA:{},lastEff:"",lastP:"",pushT:0,pushing:false,again:false,progT:0,
  students:null,stuUnsub:null,stuSel:null,names:{},sig:"",confirmDel:false,initAt:0};
