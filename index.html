<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1917" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="家族の予定表">
  <title>家族の予定表</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1>家族の予定表</h1>
      <span id="modeBadge" class="tag" hidden>デモ</span>
      <button id="addBtn" class="add-btn" type="button" hidden>＋ 予定</button>
    </div>
    <nav id="tabs" class="tabs" hidden>
      <button type="button" data-tab="home">今日</button>
      <button type="button" data-tab="week">週の予定表</button>
      <button type="button" data-tab="settings">家族</button>
    </nav>
  </header>

  <main id="main" class="main">
    <p class="loading">読み込み中…</p>
  </main>

  <dialog id="dlg" class="dlg"></dialog>
  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
