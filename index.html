<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5eefb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#221f2b" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="家族の予定表">
  <title>家族の予定表</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1>家族の予定表</h1>
      <span id="modeBadge" class="tag" hidden>デモ</span>
      <button id="micBtn" class="icon-mic" type="button" aria-label="声で予定を書く" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11h-2Z"/></svg>
      </button>
      <button id="addBtn" class="add-btn" type="button" hidden>＋ 予定</button>
    </div>
    <nav id="tabs" class="tabs" hidden>
      <button type="button" data-tab="home">今日</button>
      <button type="button" data-tab="calendar">カレンダー</button>
      <button type="button" data-tab="settings">家族</button>
    </nav>
  </header>

  <main id="main" class="main">
    <p class="loading">読み込み中…</p>
  </main>

  <dialog id="dlg" class="dlg"></dialog>
  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
